# workspace-auto-rename configuration.
#
# Copy this file to the plugin config directory and rename it to config.toml:
#
#   herdr plugin config-dir workspace-auto-rename
#   cp config.example.toml <that directory>/config.toml
#
# The plugin is inert until `template` is set: with no config.toml (or no
# template key) workspaces keep their herdr-assigned names.

# Template applied when a workspace is created or a worktree is opened.
# Placeholders: {branch} {repo-name} {cwd-basename} {worktree-basename}
#   {agent-kind} {agent-name} {workspace-id} {workspace-number}
#   {current-label} {pr}
# Unmatched placeholders render as empty strings. When no git branch is
# known, template-no-git is used instead.
# {pr} renders as a unit: "#1234" when a PR is found for the branch, empty
# otherwise, so "{repo-name} {pr}" degrades to just the repo name. PRs are
# detected from the branch name (pr-123, pr/123, pr123, 123-fix) first, then
# via the GitHub CLI (gh) when installed. Results are cached per repo and
# branch with a timestamp: hits expire after pr-hit-ttl-seconds, misses
# after pr-miss-ttl-seconds, so a PR opened after a miss is picked up when
# the miss expires. Entries written by older plugin versions (no timestamp)
# are treated as expired and re-resolve once.
template = "{repo-name}/{branch}"

# Template used when no git branch is known (non-git working directory).
template-no-git = "{cwd-basename}"

# Never rename a workspace whose label was changed after creation, so manual
# renames are respected. Set to false to always re-apply the template.
only-rename-unmodified = true

# Also rename when an agent is detected in a workspace that still carries
# its birth label (this is what fills {agent-kind}).
rename-on-agent-detect = true

# Re-render the template when the workspace cwd changes (detected on pane
# focus and agent status changes; herdr emits no event for cd itself).
rename-on-cwd-change = true

# On startup and agent detection, treat never-before-seen workspaces as
# unmodified and rename them. Set to false to only record their labels:
# this protects names that predate the plugin install.
adopt-existing = true

# {pr} cache lifetimes in seconds. Hits (a resolved PR number) default to
# one day, misses ("none") to one hour, so a PR opened after a miss is
# picked up on a later render. Set either to 0 to never expire that kind of
# entry.
pr-hit-ttl-seconds = "86400"
pr-miss-ttl-seconds = "3600"

# Map repository names to shorter display strings for {repo-name}.
# Repositories not listed here keep their full name.
[repo-alias]
serverless-components = "SCL"
datadog-lambda-extension = "bottlecap"
